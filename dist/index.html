<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Chamma Store — Uniquement des produits originaux</title>
    <script>
      // Open the connections to the API host before the bundle asks for them.
      //
      // In the split-host deployment the storefront (chammastore.com) reads
      // the API and its media from api.chammastore.com, and a cross-origin
      // request pays DNS, TCP and TLS before any byte of the homepage payload
      // moves. Two sockets are warmed because the browser keeps two: a
      // credential-less fetch (every API call) and a no-cors image load (every
      // product photograph) do not share one. Doing this here, while the
      // bundle is still downloading, overlaps the handshake with work the
      // browser is doing anyway.
      //
      // `https://api.chammastore.com` is empty for the single-origin Docker deployment and
      // in development, where everything is same-origin — the guard leaves
      // those builds with no link at all rather than a preconnect to nothing.
      ;(function () {
        var origin = 'https://api.chammastore.com'
        if (!/^https?:\/\//.test(origin)) return
        var preconnect = function () {
          var link = document.createElement('link')
          link.setAttribute('rel', 'preconnect')
          link.setAttribute('href', origin)
          return link
        }
        document.head.appendChild(preconnect())
        var cors = preconnect()
        cors.setAttribute('crossorigin', '')
        document.head.appendChild(cors)
      })()
    </script>
    <script>
      // A reload has to start at the top. Chrome replays the offset it saved for
      // this history entry against the document while it is still short — the
      // storefront mounts a spinner and the shell first, and the API fills the
      // page in afterwards — so the replay clamps to the bottom of that short
      // page and the shopper lands well down the real one with the header out of
      // sight. The app owns scroll instead: `ScrollToTop` resets the storefront
      // on every route, so the browser's own restoration is turned off here,
      // before it runs.
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
    </script>
    <script>
      // One canonical, from the URL, before the bundle runs.
      //
      // Every storefront path is served this same document and the SPA wrote
      // the canonical only after React had mounted and the API had answered.
      // A crawler reading the document in the meantime — or one that never
      // ran the bundle — saw identical HTML under /fr, /ar and /en with no
      // canonical, which Google reports as "duplicate without user-selected
      // canonical" and refuses to index. Naming the document here, from its
      // own path, closes that gap; `useSeo` replaces the tag with the
      // authoritative value (the API's canonical plus the hreflang set) once
      // the page has data.
      //
      // The path test is the list of pages that actually carry content: the
      // noindex routes (search, cart, checkout, wishlist, order, admin) are
      // left without a canonical so the two signals never disagree.
      ;(function () {
        var path = location.pathname.replace(/\/+$/, '')
        if (!/^\/(fr|ar|en)(\/(products(\/[^/]+)?|offers|brands\/[^/]+|categories\/[^/]+))?$/.test(path)) return
        var origin = 'https://chammastore.com'
        if (!/^https?:\/\//.test(origin)) origin = location.origin
        var link = document.createElement('link')
        link.setAttribute('rel', 'canonical')
        link.setAttribute('href', origin.replace(/\/$/, '') + path)
        document.head.appendChild(link)
      })()
    </script>
    <script type="module" crossorigin src="/assets/index-BYxSn9dO.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Ce5fB1iE.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
