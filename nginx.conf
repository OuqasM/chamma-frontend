server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Without this nginx caps request bodies at its 1 MB default and answers an
    # oversized upload with an HTML 413 page, which the SPA then fails to parse
    # as JSON. Kept in step with the PHP upload limits below.
    client_max_body_size 12m;

    # Hashed build assets are immutable; index.html must never be cached.
    # `^~` so the image rule below cannot pull a hashed file out of here.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API proxy: keeps the browser free of CORS and lets the SPA
    # use relative /api paths. Uploaded media (/images) is served directly
    # from the docroot below, not proxied.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded media is part of the docroot (compose mounts the API's
    # public/images here read-only), so the browser fetches images straight
    # from nginx instead of through a php artisan serve worker — images are
    # the bulk of a page's weight, and one PHP worker per image request was
    # the slowest way to deliver them. `^~` for the same reason as /assets/
    # above.
    location ^~ /images/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Un-hashed artwork copied from public/ (the hero photographs, the logo,
    # the bank slip, the favicon): these can change under their own name, so a
    # week rather than a year — the same policy the production .htaccess
    # applies. Regex locations outrank plain prefixes, which is why /assets/
    # and /images/ above are declared `^~`. A missing file 404s here rather
    # than falling through to the SPA, which is correct for an image request.
    location ~* \.(?:jpe?g|png|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Client-side routing — but the SPA owns a known URL space, not every URL:
    # every storefront route lives under a locale prefix (fr/ar/en) and the
    # admin panel under /admin. Those fall back to index.html so a refresh or a
    # shared link on a client-side route keeps working. Anything else that is
    # not a file on disk is a real 404: answering every URL with 200 and a
    # client-rendered "not found" is what Google reports as a soft 404. The
    # 404 document is still the bundle (error_page keeps the 404 status), so a
    # human who follows a dead link lands in the shop; for the URLs the SPA
    # does own, the product and brand pages render their own 404 view with a
    # noindex meta when the API says the resource is not there.
    error_page 404 /index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ @spa;
    }

    location @spa {
        if ($uri ~ ^/(?:fr|ar|en)(?:/|$)) { rewrite ^ /index.html last; }
        if ($uri ~ ^/admin(?:/|$))        { rewrite ^ /index.html last; }
        return 404;
    }
}
