server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Without this nginx caps request bodies at its 1 MB default and answers an
    # oversized upload with an HTML 413 page, which the SPA then fails to parse
    # as JSON. Kept in step with the PHP upload limits below.
    client_max_body_size 12m;

    # Hashed build assets are immutable; index.html must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin API + artwork proxy: keeps the browser free of CORS and lets
    # the SPA use relative /api and /images paths.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /images/ {
        proxy_pass http://backend:8000/images/;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Client-side routing: every unknown path is handled by the SPA router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
